# Demonstração 5 — Apache Airflow 3.3.0 rodando localmente (LocalExecutor,
# simplificado para fins didáticos, não recomendado para produção).
#
# A partir do Airflow 3, o antigo "webserver" virou "api-server" e o
# processamento de DAGs saiu do scheduler para um serviço próprio,
# "dag-processor" (obrigatório mesmo em setups simples/locais) — por isso
# este compose tem mais serviços do que teria numa versão 2.x.

x-airflow-common: &airflow-common
  image: apache/airflow:3.3.0
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # No Airflow 3, tasks não acessam mais o banco direto: tudo passa pela
    # Execution API do api-server, autenticada via um segredo JWT
    # compartilhado entre todos os componentes.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-apiserver:8080/execution/"
    AIRFLOW__API_AUTH__JWT_SECRET: ppi-curso-jwt-secret
    AIRFLOW__API_AUTH__JWT_ISSUER: airflow
    AIRFLOW__WEBSERVER__SECRET_KEY: key_12345
  volumes:
    - ./dags:/opt/airflow/dags
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    container_name: dl-airflow-db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    volumes:
      - airflow_db:/var/lib/postgresql/data

  airflow-init:
    <<: *airflow-common
    container_name: dl-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username airflow --password airflow \
          --firstname Instrutor --lastname PPI \
          --role Admin --email instrutor@example.com

  airflow-apiserver:
    <<: *airflow-common
    container_name: dl-airflow-apiserver
    command: api-server
    ports:
      - "8080:8080"
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: dl-airflow-scheduler
    command: scheduler
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    container_name: dl-airflow-dagprocessor
    command: dag-processor
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow_db:
